[project]
name = "playbook-iq"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.61",
    "fastapi>=0.141.1",
    "opensearch-py>=3.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "streamlit>=1.60.0",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI's Depends()-in-default-argument is the standard DI pattern
